<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1430" viewBox="0 0 1100 1430"><rect x="8" y="8" width="1084" height="1414" rx="0" fill="white" stroke="#222"/><polygon points="8,8 368,8 368,38 353,53 8,53" fill="#eeeeee" stroke="#222"/><text x="22" y="30.0" font-family="Arial" font-size="21" text-anchor="start" dominant-baseline="middle" font-weight="bold" font-style="normal">act  Создание привычки (UC-03)</text><rect x="90.0" y="95" width="340" height="76" rx="38.0" fill="white" stroke="#222"/><text x="260" y="133.0" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Начало</text><rect x="90.0" y="205" width="340" height="76" rx="0" fill="white" stroke="#222"/><text x="260" y="243.0" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Нажать «Новая привычка»</text><rect x="630.0" y="205" width="340" height="76" rx="0" fill="white" stroke="#222"/><text x="800" y="243.0" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Показать форму</text><rect x="90.0" y="380" width="340" height="76" rx="0" fill="white" stroke="#222"/><text x="260" y="407.02" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Ввести название</text><text x="260" y="428.98" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">и нажать «Сохранить»</text><rect x="630.0" y="380" width="340" height="76" rx="0" fill="white" stroke="#222"/><polyline points="644.0,380 644.0,456" fill="none" stroke="#222"/><polyline points="956.0,380 956.0,456" fill="none" stroke="#222"/><text x="800" y="407.02" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Проверить сессию и CSR