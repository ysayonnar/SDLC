<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920"><rect x="8" y="8" width="1484" height="904" rx="0" fill="white" stroke="#222"/><polygon points="8,8 555,8 555,38 540,53 8,53" fill="#eeeeee" stroke="#222"/><text x="22" y="30.0" font-family="Arial" font-size="21" text-anchor="start" dominant-baseline="middle" font-weight="bold" font-style="normal">stm  Habit  [жизненный цикл привычки и отметки]</text><ellipse cx="79.0" cy="99.0" rx="9.0" ry="9.0" fill="#222222" stroke="#222"/><polyline points="88,99 180,99 180,170" fill="none" stroke="#222"/><polyline points="185.0,158.0 180,170 175.0,158.0" fill="none" stroke="#222"/><text x="270" y="114.0" font-family="Arial" font-size="19" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">create / сохранить Habit</text><rect x="60" y="170" width="1140" height="610" rx="18" fill="white" stroke="#222"/><text x="85" y="197.0" font-family="Arial" font-size="23" text-anchor="start" dominant-baseline="middle" font-weight="bold" font-style="normal">Active</text><text x="650" y="197.0" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="italic">Данные привычки и история существуют</text><ellipse cx="109.0" cy="259.0" rx="9.0" ry="9.0" fill="#222222" stroke="#222"/><polyline points="118,259 250,259 250,350" fill="none" stroke="#222"/><polyline points="255.0,338.0 250,350 245.0,338.0" fill="none" stroke="#222"/><rect x="120" y="350" width="390" height="140" rx="15" fill="white" stroke="#222"/><polyline points="120,393 510,393" fill="none" stroke="#222"/><text x="315" y="373.0" font-family="Arial" font-size="22" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="normal">Не отмечена сегодня</text><text x="315" y="431.02" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Сегодня нет в D</text><text x="315" y="452.98" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Серия зависит от вчерашнего дня</text><rect x="730" y="350" width="390" height="140" rx="15" fill="white" stroke="#222"/><polyline points="730,393 1120,393" fill="none" stroke="#222"/><text x="925" y="373.0" font-family="Arial" font-size="22" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="normal">Отмечена сегодня</text><text x="925" y="431.02" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Сегодня есть в D</text><text x="925" y="452.98" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Очки = 10 × число отметок</text><polyline points="510,385 730,385" fill="none" stroke="#222"/><polyline points="718.0,380.0 730,385 718.0,390.0" fill="none" stroke="#222"/><text x="620" y="350.0" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">PUT [дата верна]</text><polyline points="730,460 510,460" fill="none" stroke="#222"/><polyline points="522.0,465.0 510,460 522.0,455.0" fill="none" stroke="#222"/><text x="620" y="493.0" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">DELETE [дата верна]</text><polyline points="120,425 85,425 85,555 315,555 315,490" fill="none" stroke="#222"/><polyline points="310.0,502.0 315,490 320.0,502.0" fill="none" stroke="#222"/><text x="320" y="590.0" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">DELETE / без изменений</text><text x="610" y="644.02" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">GET нового дня: дата изменяется, история сохраняется;</text><text x="610" y="665.98" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">на следующем снимке Сегодня нет в D (BR-04)</text><polyline points="925,350 925,285 315,285 315,350" fill="none" stroke="#222"/><polyline points="320.0,338.0 315,350 310.0,338.0" fill="none" stroke="#222"/><text x="625" y="260.0" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">GET [новый день] / пересчитать today, не удалять D</text><polyline points="1120,400 1160,400 1160,555 925,555 925,490" fill="none" stroke="#222"/><polyline points="920.0,502.0 925,490 930.0,502.0" fill="none" stroke="#222"/><text x="1015" y="590.0" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">PUT / без дубля</text><rect x="1250" y="390" width="200" height="100" rx="15" fill="white" stroke="#222"/><text x="1350" y="440.0" font-family="Arial" font-size="23" text-anchor="middle" dominant-baseline="middle" font-weight="bold" font-style="normal">Deleted</text><polyline points="1200,440 1250,440" fill="none" stroke="#222"/><polyline points="1238.0,435.0 1250,440 1238.0,445.0" fill="none" stroke="#222"/><text x="1315" y="339.63" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">deleteHabit /</text><text x="1315" y="360.37" font-family="Arial" font-size="17" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">каскадно удалить D</text><ellipse cx="1349.0" cy="579.0" rx="14.0" ry="14.0" fill="white" stroke="#222"/><ellipse cx="1349.0" cy="579.0" rx="7.0" ry="7.0" fill="#222222" stroke="#222"/><polyline points="1350,490 1350,565" fill="none" stroke="#222"/><polyline points="1355.0,553.0 1350,565 1345.0,553.0" fill="none" stroke="#222"/><text x="620" y="829.02" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Active: rename / изменить только имя; неверная дата и чужой ID не меняют состояние.</text><text x="620" y="850.98" font-family="Arial" font-size="18" text-anchor="middle" dominant-baseline="middle" font-weight="normal" font-style="normal">Состояния — проекция на serverDate, не отдельное поле БД. История прошлых дней неизменяема.</text></svg>